name: Build Meiyo Control APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid android-actions/setup-android, which currently attempts to
      # install the removed legacy "tools" package and fails before Gradle.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || true
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Meiyo-Control-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
